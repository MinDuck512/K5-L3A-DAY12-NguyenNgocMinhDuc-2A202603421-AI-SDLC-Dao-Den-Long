<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="data:,"/><title>Đảo Đèn Lồng — Ba hòn đảo</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#F5F1E6;background:#0E1430}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}button,input{font:inherit}button{padding:.7rem 1.1rem;border:1px solid #F2C14E;border-radius:.5rem;background:#1B2350;color:#F5F1E6;cursor:pointer}button:hover{background:#39456b}button:focus-visible{outline:3px solid #FFE9B0}p{line-height:1.5}h1,h2{color:#F2C14E}.panel{padding:.75rem 1rem;background:#0e1430e8;border:1px solid #f2c14e60;border-radius:.6rem}#hud{position:fixed;inset:1rem 1rem auto;display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;pointer-events:none}#right{text-align:right}#time{font-size:1.7rem;text-align:center;font-variant-numeric:tabular-nums}#score{color:#F2C14E}.danger{color:#FF5A5F;animation:blink .6s infinite alternate}.distinct .danger,.distinct #wind,.distinct #error{color:#FFFFFF}.distinct .danger::before,.distinct #error::before{content:'⚠ '}@keyframes blink{to{opacity:.35}}#carry{position:fixed;left:50%;bottom:3rem;transform:translateX(-50%);display:flex;gap:.2rem}.slot{width:1.1rem;height:1.1rem;border:1px solid #F2C14E;border-radius:.2rem;background:#1B2350}.slot.full{background:#FFF6C2}#cooldowns{position:fixed;right:1rem;bottom:3rem;max-width:18rem}#prompt{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);text-align:center;pointer-events:none}#controls{position:fixed;bottom:.5rem;width:100%;text-align:center;font-size:.875rem;margin:0}#direction{position:fixed;left:50%;top:6.5rem;transform:translateX(-50%);color:#F2C14E}#wind{position:fixed;top:10rem;left:1rem;color:#FFE58A;font-size:1.2rem}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0e1430a8;padding:1rem}#overlay[hidden],[hidden]{display:none!important}.dialog{background:#0e1430f5;border:1px solid #F2C14E;border-radius:1rem;padding:1.5rem;width:min(34rem,95vw);max-height:90vh;overflow:auto;text-align:center}.actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}label{display:block;margin:1rem 0}input[type=range]{width:100%;accent-color:#F2C14E}#error{position:fixed;bottom:2rem;color:#FF5A5F}@media(max-width:700px){#hud{gap:.25rem;inset:.5rem}.panel{padding:.5rem;font-size:.875rem}#cooldowns{bottom:8rem;font-size:.875rem}#carry{bottom:4rem}.slot{width:.75rem;height:.9rem}#controls{font-size:.875rem}#prompt{bottom:6rem;width:90%}}
</style>
</head>
<body>
<div id="hud"><div class="panel"><strong id="flames"></strong><div id="night-label"></div></div><div id="time" class="panel"></div><div id="right" class="panel"><div id="lantern-count"></div><div id="score"></div></div></div>
<div id="direction" class="panel" hidden></div><div id="wind"></div><div id="prompt" class="panel" role="status"></div><div id="carry" aria-label="Đom đóm đang mang"></div><div id="cooldowns" class="panel"></div>
<p id="controls">WASD / mũi tên: đi · Space: nhảy · Shift: lướt · E: nạp · F: tỏa sáng · Esc / P: tạm dừng · Kéo chuột: camera</p>
<div id="overlay"><section class="dialog"><h1 id="dialog-title">Đảo Đèn Lồng</h1><p id="dialog-message"></p><p id="dialog-detail"></p><div id="settings" hidden><label>Âm lượng <input id="volume" type="range" min="0" max="1" step="0.05"/></label><label>Độ nhạy chuột <input id="sensitivity" type="range" min="0.1" max="1" step="0.05"/></label><label><input id="distinct-palette" type="checkbox"/> Bảng màu dễ phân biệt</label></div><div id="actions" class="actions"></div></section></div>
<p id="error" role="alert" hidden></p><script type="module" src="/src/main.js"></script>
</body></html>
