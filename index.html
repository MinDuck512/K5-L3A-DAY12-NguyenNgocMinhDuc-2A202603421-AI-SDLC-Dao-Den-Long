<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="data:,"/><title>Đảo Đèn Lồng — Ba hòn đảo</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;color:#F5F1E6;background:#0E1430;font-size:18px}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-size:1rem}
body.large-font{font-size:1.25rem}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
button,input{font:inherit}
button{padding:.7rem 1.1rem;border:1px solid #F2C14E;border-radius:.5rem;background:#1B2350;color:#F5F1E6;cursor:pointer;transition:background .2s}
button:hover{background:#39456b}
button:focus-visible{outline:3px solid #FFE9B0}
p{line-height:1.5}
h1,h2,h3{color:#F2C14E;margin-top:0}
.panel{padding:.75rem 1rem;background:#0e1430e8;border:1px solid #f2c14e60;border-radius:.6rem;font-size:1rem}
#hud{position:fixed;inset:1rem 1rem auto;display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;pointer-events:none;z-index:10}
#right{text-align:right}
#time{font-size:1.8rem;text-align:center;font-variant-numeric:tabular-nums}
#score{color:#F2C14E}
.danger{color:#FF5A5F;animation:blink .6s infinite alternate}
body.reduce-motion .danger{animation:none}
.distinct .danger,.distinct #wind,.distinct #error{color:#FFFFFF}
.distinct .danger::before,.distinct #error::before{content:'⚠ '}
@keyframes blink{to{opacity:.35}}
#carry{position:fixed;left:50%;bottom:3.2rem;transform:translateX(-50%);display:flex;gap:.25rem;z-index:10}
.slot{width:1.2rem;height:1.2rem;border:1px solid #F2C14E;border-radius:.25rem;background:#1B2350}
.slot.full{background:#FFF6C2}
#cooldowns{position:fixed;right:1rem;bottom:3.2rem;max-width:20rem;z-index:10}
#prompt{position:fixed;left:50%;bottom:6.5rem;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10}
#controls{position:fixed;bottom:.5rem;width:100%;text-align:center;font-size:.9rem;margin:0;z-index:5}
#direction{position:fixed;left:50%;top:6.5rem;transform:translateX(-50%);color:#F2C14E;z-index:10}
#wind{position:fixed;top:9.5rem;left:1rem;color:#FFE58A;font-size:1.1rem;z-index:10}
#subtitles{position:fixed;top:12.5rem;left:50%;transform:translateX(-50%);color:#FFE9B0;background:#0e1430d0;padding:.5rem 1.2rem;border-radius:.5rem;border:1px solid #F2C14E;z-index:15;font-weight:bold;text-align:center}
#shade-indicator{position:fixed;color:#FF5A5F;font-weight:bold;font-size:1.1rem;z-index:15;pointer-events:none}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0e1430b8;padding:1rem;z-index:100}
#overlay[hidden],[hidden]{display:none!important}
.dialog{background:#0e1430f5;border:1px solid #F2C14E;border-radius:1rem;padding:1.5rem;width:min(38rem,95vw);max-height:90vh;overflow:auto;text-align:center}
.actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
label{display:block;margin:.8rem 0;text-align:left}
input[type=range]{width:100%;accent-color:#F2C14E}
input[type=text]{width:100%;padding:.5rem .8rem;background:#1B2350;border:1px solid #F2C14E;border-radius:.4rem;color:#F5F1E6;margin-top:.3rem}
.rebind-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:1rem 0;text-align:left;font-size:.9rem}
.rebind-row{display:flex;justify-content:space-between;align-items:center;background:#121a3a;padding:.4rem .6rem;border-radius:.4rem}
.rebind-btn{padding:.3rem .6rem;font-size:.85rem}
.rebind-btn.listening{background:#C8102E;animation:blink .5s infinite alternate}
.conflict-warn{color:#FF5A5F;font-weight:bold;margin:.5rem 0}
.leaderboard-table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem}
.leaderboard-table th,.leaderboard-table td{padding:.4rem .6rem;border-bottom:1px solid #f2c14e40;text-align:left}
.leaderboard-table th{color:#F2C14E}
#error{position:fixed;bottom:2rem;color:#FF5A5F;z-index:20}
@media(max-width:700px){#hud{gap:.25rem;inset:.5rem}.panel{padding:.4rem;font-size:.85rem}#cooldowns{bottom:8rem;font-size:.85rem}#carry{bottom:4rem}.slot{width:.9rem;height:1rem}#controls{font-size:.8rem}#prompt{bottom:6rem;width:92%}.rebind-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="hud">
  <div class="panel"><strong id="flames"></strong><div id="night-label"></div></div>
  <div id="time" class="panel"></div>
  <div id="right" class="panel"><div id="lantern-count"></div><div id="score"></div></div>
</div>
<div id="direction" class="panel" hidden></div>
<div id="wind"></div>
<div id="subtitles" hidden></div>
<div id="shade-indicator" hidden></div>
<div id="prompt" class="panel" role="status"></div>
<div id="carry" aria-label="Đom đóm đang mang"></div>
<div id="cooldowns" class="panel"></div>
<p id="controls">WASD / mũi tên: đi · Space: nhảy · Shift: lướt · E: nạp · F: tỏa sáng · Esc / P: tạm dừng · Kéo chuột: camera</p>

<div id="overlay">
  <section class="dialog">
    <h1 id="dialog-title">Đảo Đèn Lồng</h1>
    <p id="dialog-message"></p>
    <p id="dialog-detail"></p>

    <!-- Khu vực nhập tên lưu điểm -->
    <div id="name-input-area" hidden>
      <label>Tên của bạn (3–12 ký tự):
        <input id="player-name" type="text" maxlength="12" placeholder="Ví dụ: May_ThuLe"/>
      </label>
      <p id="name-error" class="conflict-warn" hidden></p>
    </div>

    <!-- Cài đặt & Dễ tiếp cận -->
    <div id="settings" hidden>
      <label>Âm lượng <input id="volume" type="range" min="0" max="1" step="0.05"/></label>
      <label>Độ nhạy chuột <input id="sensitivity" type="range" min="0.1" max="1" step="0.05"/></label>
      <label><input id="distinct-palette" type="checkbox"/> Bảng màu dễ phân biệt</label>
      <label><input id="reduce-motion" type="checkbox"/> Giảm chuyển động (tắt rung/chớp màn hình)</label>
      <label><input id="large-font" type="checkbox"/> Chữ lớn UI (×1.25)</label>
      
      <h3>Cài đặt phím điều khiển</h3>
      <div id="key-conflict" class="conflict-warn" hidden>Phát hiện phím bị trùng! Vui lòng chọn phím khác.</div>
      <div id="rebind-list" class="rebind-grid"></div>
      <button id="reset-keys-btn" type="button" style="margin-top:.5rem">Khôi phục mặc định</button>
    </div>

    <!-- Bảng xếp hạng -->
    <div id="leaderboard-view" hidden>
      <table class="leaderboard-table">
        <thead>
          <tr><th>#</th><th>Tên</th><th>Điểm</th><th>Đêm thắng</th><th>Thời gian</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>

    <div id="actions" class="actions"></div>
  </section>
</div>

<p id="error" role="alert" hidden></p>
<script type="module" src="/src/main.js"></script>
</body>
</html>
